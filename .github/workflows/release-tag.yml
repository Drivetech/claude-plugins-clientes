name: Tag de release de plugins

# Publica el marcador de release que el marketplace usa para detectar que hay
# version nueva. Cada vez que sube a main un plugins/*/.claude-plugin/plugin.json
# con un "version" que todavia no tiene tag, crea y pushea {name}--v{version}.
#
# El repo vivio 17 commits sin un solo tag y el cliente se quedo clavado en la
# version del primer sync; esto es lo que evita que vuelva a pasar.

on:
  push:
    branches: [main]
    paths:
      - 'plugins/*/.claude-plugin/plugin.json'
      - 'plugins/*/skills/*/SKILL.md'
      - '.claude-plugin/marketplace.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ningun description de skill puede pasar los 1024 caracteres
        run: python3 .github/scripts/check-skill-descriptions.py

      - name: Crear el tag de cada plugin cuya version no este tageada
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          creados=0

          for manifest in plugins/*/.claude-plugin/plugin.json; do
            nombre=$(jq -r '.name'    "$manifest")
            version=$(jq -r '.version' "$manifest")

            if [ -z "$version" ] || [ "$version" = "null" ]; then
              echo "::error file=$manifest::$nombre no declara \"version\" en plugin.json"
              exit 1
            fi

            # El marketplace tiene que anunciar la misma version que el plugin:
            # si mienten entre si, el cliente no sabe a que actualizar.
            declarada=$(jq -r --arg n "$nombre" \
              '.plugins[] | select(.name == $n) | .version // empty' \
              .claude-plugin/marketplace.json)

            if [ -z "$declarada" ]; then
              echo "::error file=.claude-plugin/marketplace.json::la entrada de $nombre no declara \"version\""
              exit 1
            fi

            if [ "$declarada" != "$version" ]; then
              echo "::error file=.claude-plugin/marketplace.json::$nombre: el marketplace anuncia $declarada y plugin.json dice $version"
              exit 1
            fi

            tag="$nombre--v$version"

            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "· $tag ya existe — nada que hacer"
              continue
            fi

            echo "· creando $tag"
            git tag -a "$tag" -m "$nombre $version"
            git push origin "refs/tags/$tag"
            creados=$((creados + 1))
          done

          echo "Tags creados: $creados"

      - name: Publicar el release con el plugin empaquetado
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          publicados=0

          # recorre los plugins, no los tags recien creados: asi tambien cubre un
          # tag que quedo sin release (por ejemplo si se tageo a mano con el CLI)
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            nombre=$(jq -r '.name'    "$manifest")
            version=$(jq -r '.version' "$manifest")
            tag="$nombre--v$version"

            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "- $tag no existe todavia, lo saltea"
              continue
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "- $tag ya tiene release"
              continue
            fi

            zip_path="$RUNNER_TEMP/$nombre.zip"
            rm -f "$zip_path"

            # el zip se arma desde la raiz del plugin: el uploader del Desktop
            # espera .claude-plugin/plugin.json en el primer nivel del archivo
            ( cd "plugins/$nombre" && zip -qr "$zip_path" . -x '.DS_Store' -x '*/.DS_Store' )

            notas="$RUNNER_TEMP/notas-$nombre.md"
            {
              echo "**Desde el marketplace:** agregar \`$REPO\` en Ajustes -> Plugins."
              echo
              echo "**A mano**, si el marketplace todavia no ofrece esta version: descargar \`$nombre.zip\` de este release y subirlo con Agregar -> Subir plugin."
              echo
              echo "La ultima version siempre esta en:"
              echo "https://github.com/$REPO/releases/latest/download/$nombre.zip"
            } > "$notas"

            echo "- publicando release $tag con $nombre.zip"
            gh release create "$tag" "$zip_path" --title "$nombre $version" --notes-file "$notas"
            publicados=$((publicados + 1))
          done

          echo "Releases publicados: $publicados"
